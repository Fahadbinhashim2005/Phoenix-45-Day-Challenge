<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <div class="profile">
            <img src="/Day11 - Music Player App/assets/profile pic.webp" alt="profile picture">
        </div>
        <div class="spotify-button">
            <img src="/Day11 - Music Player App/assets/spotify.png" alt="spotify icon">
            <span class="spotify-text">Open in Spotify</span>
        </div>
        <button class="settings-btn">
            <i class="fa-solid fa-gear"></i>
        </button>
    </header>
    <main>
        <section class="left-container">
            <section class="main-container">
                <div class="music-console">
                    <div class="album-art">
                        <div class="playlist-info">
                            <p class="playlist-label">Playlist</p>
                            <h2 class="playlist-title"></h2>
                        </div>
                        <div class="music-carousel">
                            <button class="previous-btn">
                                <i class="fa-solid fa-backward-step"></i>
                            </button>
                            <div class="album-player">
                                <div class="progress-ring"></div>
                                <audio src="" id="audio-player"></audio>
                                <img class="album-cover" src="" alt="Album Cover">
                                <button class="play-btn">
                                    <i class="fa-solid fa-play"></i>
                                </button>
                            </div>
                            <button class="next-btn">
                                <i class="fa-solid fa-forward-step"></i>
                            </button>
                        </div>
                    </div>
                    <div class="bottom-controls">
                        <button class="shuffle-btn">
                            <i class="fa-solid fa-shuffle"></i>
                        </button>
                        <button class="repeat-btn">
                            <i class="fa-solid fa-repeat"></i>
                        </button>
                    </div>
                </div>
            </section>
            <section class="bottom-container">
                <div class="equalizer"></div>
                <div class="music-details">
                    <div class="music-name"></div>
                    <div class="music-author"></div>
                    <div class="music-length"></div>
                </div>
                <div class="music-controls2">
                    <button class="like-btn">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                    <button class="share-btn">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                    <button class="more-btn">
                        <i class="fa-solid fa-ellipsis"></i>
                    </button>
                </div>
            </section>
        </section>
        <section class="right-container">
            <div class="next-up">
                <h3>Next Up</h3>
                <ul class="next-up-list"></ul>
            </div>
            <div class="related">
                <h3>Related</h3>
                <ul class="related-list"></ul>
            </div>
        </section>
    </main>
</body>
</html>
